<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IOSG Introduction Paths</title>
  <style>
    :root{--bg:#07110e;--panel:#0d1c17;--line:#203b31;--text:#eef8f2;--muted:#8ca99d;--lime:#b9ff66;--mint:#55e6aa;--amber:#ffc857;--red:#ff7b72}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 15% 0,#163a2c 0,transparent 34rem),radial-gradient(circle at 100% 30%,#102c34 0,transparent 30rem),var(--bg)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
    main{position:relative;width:min(1060px,calc(100% - 32px));margin:auto;padding:58px 0 80px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:54px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.02em}.mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid #b9ff6655;border-radius:11px;background:#b9ff6615;color:var(--lime)}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint)}
    .hero{max-width:760px;margin-bottom:30px}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:800}.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.02;letter-spacing:-.055em;margin:13px 0 18px}.hero p{font-size:18px;color:var(--muted);max-width:650px;margin:0}
    .search{display:grid;grid-template-columns:1fr 180px auto;gap:10px;padding:10px;border:1px solid var(--line);border-radius:18px;background:#0c1a16dd;box-shadow:0 22px 70px #0007;backdrop-filter:blur(18px)}input,select,button{font:inherit;color:inherit;border:0;outline:0}input,select{height:52px;border-radius:11px;background:#07120e;padding:0 16px;border:1px solid transparent}input:focus,select:focus{border-color:#b9ff6677}select{color:var(--muted)}button{height:52px;padding:0 22px;border-radius:11px;background:var(--lime);color:#10200f;font-weight:800;cursor:pointer;transition:.2s}button:hover{transform:translateY(-1px);box-shadow:0 9px 28px #b9ff6633}button:disabled{opacity:.55;cursor:wait}
    details.settings{margin:12px 4px 36px;color:var(--muted);font-size:12px}details.settings summary{cursor:pointer;width:max-content}.key{margin-top:9px;width:min(420px,100%);height:40px}
    #message{min-height:22px;margin:18px 4px;color:var(--muted)}.error{color:var(--red)!important}.hidden{display:none!important}
    .summary{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin:34px 0 16px}.summary h2{font-size:25px;letter-spacing:-.03em;margin:0}.summary p{margin:4px 0 0;color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px}
    .card{border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#10231cdd,#091510dd);padding:22px;margin-bottom:13px;box-shadow:0 15px 45px #0003}.card.recommended{border-color:#b9ff6655;background:linear-gradient(145deg,#173325ee,#0a1812ee)}.card-top{display:flex;justify-content:space-between;gap:14px}.rank{color:var(--lime);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.score{font-size:24px;font-weight:800;letter-spacing:-.05em}.score small{font-size:11px;color:var(--muted);letter-spacing:0}.path{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:19px 0}.node{padding:9px 12px;border:1px solid #355347;border-radius:10px;background:#07130f;font-weight:650}.arrow{color:var(--mint)}.action{color:#c5d8d0;margin:0 0 17px}.edges{display:grid;gap:8px}.edge{padding:12px 13px;border-left:2px solid var(--mint);background:#06110d88;border-radius:0 9px 9px 0}.edge b{font-size:12px}.edge p{margin:3px 0 0;color:var(--muted);font-size:12px}.confidence{display:inline-block;margin-left:7px;text-transform:uppercase;font-size:9px;letter-spacing:.1em;color:var(--lime)}
    .diagnostics{margin-top:24px;padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:12px}.sources{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.source{padding:5px 9px;border-radius:999px;background:#13271f}.source.ok:before{content:"● ";color:var(--mint)}
    @media(max-width:720px){main{padding-top:28px}.search{grid-template-columns:1fr}.search button,.search input,.search select{width:100%}.hero h1{font-size:43px}.summary{grid-template-columns:1fr}.card{padding:17px}}
  </style>
</head>
<body><main>
  <header><div class="brand"><span class="mark">↗</span> IOSG Relationship Graph</div><div class="status"><span class="dot"></span> Live intelligence</div></header>
  <section class="hero"><div class="eyebrow">Warm introduction finder</div><h1>Find the shortest path to anyone.</h1><p>Enter a project, domain, or X handle. We’ll rank the strongest introduction routes and show the evidence behind every connection.</p></section>
  <form id="search" class="search">
    <input id="query" required maxlength="255" placeholder="@project, @founder, company, or domain" autocomplete="off">
    <select id="kind" aria-label="Query type"><option value="auto">Detect automatically</option><option value="project_x">Project X handle</option><option value="founder_x">Founder X handle</option><option value="company_name">Company name</option><option value="domain">Domain</option></select>
    <button id="submit">Find paths <span>→</span></button>
  </form>
  <details class="settings"><summary>API access settings</summary><input id="apiKey" class="key" type="password" placeholder="Service API key (kept for this tab only)"></details>
  <div id="message">Try a project X handle to begin.</div>
  <section id="results" class="hidden"><div class="summary"><div><h2 id="target"></h2><p id="count"></p></div><span id="coverage" class="pill"></span></div><div id="cards"></div><div id="diagnostics" class="diagnostics"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), form=$('search'), query=$('query'), kind=$('kind'), key=$('apiKey'), message=$('message'), results=$('results'), cards=$('cards');
key.value=sessionStorage.getItem('iosg_api_key')||''; key.addEventListener('input',()=>sessionStorage.setItem('iosg_api_key',key.value));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(path,recommended){return `<article class="card ${recommended?'recommended':''}"><div class="card-top"><div><div class="rank">${recommended?'Recommended':'Alternative '+path.rank}</div><strong>${esc(path.iosg_contact)} should lead</strong></div><div class="score">${path.score}<small>/100</small><span class="confidence">${esc(path.confidence)}</span></div></div><div class="path">${path.path.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${esc(n)}</span>`).join('')}</div><p class="action">${esc(path.suggested_next_action)}</p><div class="edges">${path.edges.map(e=>`<div class="edge"><b>${esc(e.relationship.replaceAll('_',' '))}<span class="confidence">${Math.round(e.confidence*100)}% · ${esc(e.evidence_source)}</span></b><p>${esc(e.evidence)}</p></div>`).join('')}</div></article>`}
form.addEventListener('submit',async e=>{e.preventDefault();const button=$('submit');button.disabled=true;message.className='';message.textContent='Tracing relationships across IOSG data sources…';results.classList.add('hidden');try{const headers={'Content-Type':'application/json'};if(key.value)headers.Authorization=`Bearer ${key.value}`;const r=await fetch('/v1/introduction-paths',{method:'POST',headers,body:JSON.stringify({query:query.value.trim(),kind:kind.value,limit:5})});const data=await r.json();if(!r.ok)throw new Error(r.status===401?'Enter the service API key under API access settings.':data.detail||'Search failed');if(data.status==='not_found')throw new Error('No matching project or founder was found in the connected sources.');$('target').textContent=data.resolved_target?.label||query.value;$('count').textContent=data.recommended?`${1+data.alternatives.length} ranked introduction path${data.alternatives.length?'s':''}`:'Target found, but no credible introduction path yet.';$('coverage').textContent=`${data.diagnostics.edges_considered||0} evidence edges`;cards.innerHTML=data.recommended?card(data.recommended,true)+data.alternatives.map(p=>card(p,false)).join(''):'<article class="card">No path is better than inventing one. Try the founder handle or review source coverage below.</article>';const src=data.diagnostics.sources||{};$('diagnostics').innerHTML=`<strong>Data coverage</strong><div class="sources">${Object.entries(src).map(([n,v])=>`<span class="source ${['ok','cached_in_neon'].includes(v.status)?'ok':''}">${esc(n)} · ${esc(v.status)}</span>`).join('')}</div>`;message.textContent='';results.classList.remove('hidden')}catch(err){message.className='error';message.textContent=err.message}finally{button.disabled=false}});
</script></body></html>
